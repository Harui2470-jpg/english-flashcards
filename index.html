rm", "ja": "農場"}, {"n": 153, "w": "treasure", "ja": "宝物"}, {"n": 154, "w": "hole", "ja": "穴"}, {"n": 155, "w": "cloud", "ja": "雲"}, {"n": 156, "w": "phone", "ja": "電話"}, {"n": 157, "w": "sorry", "ja": "すまなく思って"}, {"n": 158, "w": "careful", "ja": "注意深い"}, {"n": 159, "w": "wonderful", "ja": "すばらしい"}, {"n": 160, "w": "heavy", "ja": "重い、ひどい"}, {"n": 161, "w": "sick", "ja": "病気の"}, {"n": 162, "w": "dear", "ja": "親愛なる"}, {"n": 163, "w": "glad", "ja": "うれしい"}, {"n": 164, "w": "dark", "ja": "暗い"}, {"n": 165, "w": "sad", "ja": "悲しい"}, {"n": 166, "w": "cute", "ja": "かわいい"}, {"n": 167, "w": "free", "ja": "暇な、自由な、無料の"}, {"n": 168, "w": "foreign", "ja": "外国の"}, {"n": 169, "w": "low", "ja": "低い"}, {"n": 170, "w": "safe", "ja": "安全な"}, {"n": 171, "w": "angry", "ja": "怒った"}, {"n": 172, "w": "lucky", "ja": "幸運な"}, {"n": 173, "w": "bright", "ja": "明るい、輝いて"}, {"n": 174, "w": "soft", "ja": "柔らかい"}, {"n": 175, "w": "loud", "ja": "音が大きい"}, {"n": 176, "w": "even", "ja": "〜でさえ"}, {"n": 177, "w": "back", "ja": "戻って、後ろに"}, {"n": 178, "w": "still", "ja": "まだ、なお"}, {"n": 179, "w": "early", "ja": "早く"}, {"n": 180, "w": "soon", "ja": "すぐに、まもなく"}, {"n": 181, "w": "away", "ja": "離れて、遠くへ"}, {"n": 182, "w": "almost", "ja": "ほとんど"}, {"n": 183, "w": "together", "ja": "一緒に"}, {"n": 184, "w": "maybe", "ja": "もしかすると"}, {"n": 185, "w": "once", "ja": "一度、かつて"}, {"n": 186, "w": "else", "ja": "ほかに"}, {"n": 187, "w": "ago", "ja": "〜前に"}, {"n": 188, "w": "straight", "ja": "まっすぐに"}, {"n": 189, "w": "slowly", "ja": "ゆっくりと"}, {"n": 190, "w": "suddenly", "ja": "突然、急に"}, {"n": 191, "w": "until", "ja": "〜するまで"}, {"n": 192, "w": "since", "ja": "〜したときから、〜以来"}, {"n": 193, "w": "around", "ja": "〜の周りに、あちこち"}, {"n": 194, "w": "over", "ja": "〜を超えて、上に"}, {"n": 195, "w": "without", "ja": "〜なしに"}, {"n": 196, "w": "through", "ja": "〜を通り抜けて"}, {"n": 197, "w": "between", "ja": "〜の間に"}, {"n": 198, "w": "during", "ja": "〜の間に"}, {"n": 199, "w": "behind", "ja": "〜の後ろに"}, {"n": 200, "w": "along", "ja": "〜に沿って"}];const $=id=>document.getElementById(id);const key='section1_200_progress_v1';let marks={};try{marks=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let deck=[...words],index=0,revealed=false,shuffled=false;const save=()=>{try{localStorage.setItem(key,JSON.stringify(marks))}catch(e){}};function rebuild(){const scope=$('scope').value;deck=words.filter(x=>scope==='all'||(scope==='weak'?marks[x.n]==='weak':!marks[x.n]));if(shuffled)(()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}})();index=0;revealed=false;render()}function render(){let x=deck[index];$('counter').textContent=deck.length?`${index+1} / ${deck.length}`:'0 / 0';$('progressText').textContent=`全体 ${Object.values(marks).filter(x=>x==='known').length} / 200 覚えた`;$('fill').style.width=deck.length?((index+1)/deck.length*100)+'%':'0%';$('num').textContent=x?`No. ${x.n}`:'';$('front').textContent=x?($('direction').value==='en'?x.w:x.ja):'該当する単語はありません';$('back').textContent=x?($('direction').value==='en'?x.ja:x.w):'';$('back').classList.toggle('hidden',!revealed);$('hint').textContent=revealed?'タップして問題に戻る':'タップして答えを見る';$('flip').textContent=revealed?'問題に戻る':'答えを見る';$('prev').disabled=!x||index===0;$('next').disabled=!x||index===deck.length-1;$('speak').disabled=!x;$('weak').disabled=!x;$('known').disabled=!x;const known=Object.values(marks).filter(v=>v==='known').length,weak=Object.values(marks).filter(v=>v==='weak').length;$('stats').textContent=`✓ 覚えた ${known}語　｜　✕ 復習 ${weak}語　｜　未判定 ${200-known-weak}語`;}function flip(){if(!deck.length)return;revealed=!revealed;render()}function move(n){if(index+n<0||index+n>=deck.length)return;index+=n;revealed=false;render()}function mark(v){if(!deck.length)return;marks[deck[index].n]=v;save();if($('scope').value==='all'){if(index<deck.length-1)index++;revealed=false;render()}else{const old=index;rebuild();index=Math.min(old,Math.max(0,deck.length-1));render()}}$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('weak').onclick=()=>mark('weak');$('known').onclick=()=>mark('known');$('scope').onchange=rebuild;$('direction').onchange=()=>{revealed=false;render()};$('shuffle').onclick=()=>{shuffled=true;rebuild()};$('order').onclick=()=>{shuffled=false;rebuild()};$('restart').onclick=()=>{index=0;revealed=false;render()};$('reset').onclick=()=>{if(confirm('200語の学習記録を消去しますか？')){marks={};save();rebuild()}};let currentUtterance=null;
let activeAudio=null;
let audioRequest=0;
const defaultSpeakLabel='🔊 英語を読み上げる';
function stopAudio(){
 audioRequest++;
 if(activeAudio){activeAudio.pause();activeAudio.src='';activeAudio=null;}
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
 currentUtterance=null;
 $('speak').textContent=defaultSpeakLabel;
}
function synthSpeak(word,request){
 if(request!==audioRequest)return;
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
  $('speak').textContent='音声を取得できませんでした';return;
 }
 const synth=window.speechSynthesis;
 try{
  const utterance=new SpeechSynthesisUtterance(word);
  currentUtterance=utterance;
  utterance.lang='en-US';utterance.rate=0.85;utterance.pitch=1;utterance.volume=1;
  const voices=synth.getVoices();
  const english=voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>v.lang.startsWith('en'));
  if(english)utterance.voice=english;
  utterance.onstart=()=>{if(request===audioRequest)$('speak').textContent='🔊 再生中（タップで停止）';};
  utterance.onend=()=>{if(request===audioRequest){currentUtterance=null;$('speak').textContent=defaultSpeakLabel;}};
  utterance.onerror=e=>{if(request===audioRequest){currentUtterance=null;$('speak').textContent='🔊 再試行（'+e.error+'）';}};
  synth.speak(utterance);
  if(synth.paused)synth.resume();
 }catch(e){$('speak').textContent='🔊 再試行';}
}
async function speakWord(){
 if(!deck.length)return;
 if(activeAudio||currentUtterance||$('speak').dataset.loading==='yes'){
  stopAudio();$('speak').dataset.loading='no';return;
 }
 const request=++audioRequest;
 const word=deck[index].w;
 const button=$('speak');
 button.dataset.loading='yes';button.textContent='🔊 発音を読み込み中…';
 try{
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),6500);
  let response;
  try{response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word),{signal:controller.signal});}
  finally{clearTimeout(timer);}
  if(request!==audioRequest)return;
  if(!response.ok)throw Error('発音データなし');
  const entries=await response.json();
  const audioUrl=entries.flatMap(x=>x.phonetics||[]).map(p=>p.audio).find(u=>u&&u.startsWith('https://'));
  if(!audioUrl)throw Error('発音音声なし');
  const audio=new Audio(audioUrl);
  activeAudio=audio;
  audio.onended=()=>{if(request===audioRequest){activeAudio=null;button.textContent=defaultSpeakLabel;}};
  audio.onerror=()=>{if(request===audioRequest){activeAudio=null;synthSpeak(word,request);}};
  await audio.play();
  if(request===audioRequest)button.textContent='🔊 再生中（タップで停止）';
 }catch(e){
  if(request===audioRequest){activeAudio=null;synthSpeak(word,request);}
 }finally{if(request===audioRequest)button.dataset.loading='no';}
}
$('speak').addEventListener('click',speakWord);
// Stop previous pronunciation when changing cards.
['prev','next','weak','known','shuffle','order','restart','reset','scope','direction'].forEach(id=>{
 $(id).addEventListener(id==='scope'||id==='direction'?'change':'click',()=>{stopAudio();$('speak').dataset.loading='no';});
});
