,{"n":398,"w":"position","ja":"立場、位置、姿勢、職"},{"n":399,"w":"memory","ja":"記憶、記憶力、思い出"},{"n":400,"w":"level","ja":"水準、レベル、程度"}];const $=id=>document.getElementById(id);const key='section2_201_400_progress_v1';let marks={};try{marks=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let deck=[...words],index=0,revealed=false,shuffled=false;const save=()=>{try{localStorage.setItem(key,JSON.stringify(marks))}catch(e){}};function rebuild(){const scope=$('scope').value;deck=words.filter(x=>scope==='all'||(scope==='weak'?marks[x.n]==='weak':!marks[x.n]));if(shuffled)(()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}})();index=0;revealed=false;render()}function render(){let x=deck[index];$('counter').textContent=deck.length?`${index+1} / ${deck.length}`:'0 / 0';$('progressText').textContent=`全体 ${Object.values(marks).filter(x=>x==='known').length} / 200 覚えた`;$('fill').style.width=deck.length?((index+1)/deck.length*100)+'%':'0%';$('num').textContent=x?`No. ${x.n}`:'';$('front').textContent=x?($('direction').value==='en'?x.w:x.ja):'該当する単語はありません';$('back').textContent=x?($('direction').value==='en'?x.ja:x.w):'';$('back').classList.toggle('hidden',!revealed);$('hint').textContent=revealed?'タップして問題に戻る':'タップして答えを見る';$('flip').textContent=revealed?'問題に戻る':'答えを見る';$('prev').disabled=!x||index===0;$('next').disabled=!x||index===deck.length-1;$('speak').disabled=!x;$('weak').disabled=!x;$('known').disabled=!x;const known=Object.values(marks).filter(v=>v==='known').length,weak=Object.values(marks).filter(v=>v==='weak').length;$('stats').textContent=`✓ 覚えた ${known}語　｜　✕ 復習 ${weak}語　｜　未判定 ${200-known-weak}語`;}function flip(){if(!deck.length)return;revealed=!revealed;render()}function move(n){if(index+n<0||index+n>=deck.length)return;index+=n;revealed=false;render()}function mark(v){if(!deck.length)return;marks[deck[index].n]=v;save();if($('scope').value==='all'){if(index<deck.length-1)index++;revealed=false;render()}else{const old=index;rebuild();index=Math.min(old,Math.max(0,deck.length-1));render()}}$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('weak').onclick=()=>mark('weak');$('known').onclick=()=>mark('known');$('scope').onchange=rebuild;$('direction').onchange=()=>{revealed=false;render()};$('shuffle').onclick=()=>{shuffled=true;rebuild()};$('order').onclick=()=>{shuffled=false;rebuild()};$('restart').onclick=()=>{index=0;revealed=false;render()};$('reset').onclick=()=>{if(confirm('No.201〜400の学習記録を消去しますか？')){marks={};save();rebuild()}};// Audio: try browser English voice first, then dictionary audio as fallback.
let currentAudio=null;
let speechToken=0;
const speakButton=$('speak');
const normalLabel='🔊 英語を読み上げる';
function stopSpeaking(){
 speechToken++;
 if(window.speechSynthesis) window.speechSynthesis.cancel();
 if(currentAudio){currentAudio.pause();currentAudio=null;}
 speakButton.textContent=normalLabel;
}
async function dictionaryFallback(word,token){
 speakButton.textContent='🔊 音声を取得中…';
 try{
  const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));
  if(!r.ok)throw Error('dictionary unavailable');
  const data=await r.json();
  const urls=data.flatMap(e=>e.phonetics||[]).map(p=>p.audio).filter(Boolean).map(u=>u.startsWith('//')?'https:'+u:u);
  if(!urls.length)throw Error('no pronunciation');
  if(token!==speechToken)return;
  const audio=new Audio(urls[0]);currentAudio=audio;
  audio.onended=()=>{if(token===speechToken){currentAudio=null;speakButton.textContent=normalLabel;}};
  await audio.play();
  if(token===speechToken)speakButton.textContent='🔊 再生中（停止）';
 }catch(e){if(token===speechToken)speakButton.textContent='🔊 音声が出ません（Safariで開いて確認）';}
}
function speakWord(){
 if(!deck.length)return;
 if(speakButton.textContent.includes('再生中')){stopSpeaking();return;}
 stopSpeaking();
 const token=speechToken;
 const word=deck[index].w;
 if(!('speechSynthesis' in window)){dictionaryFallback(word,token);return;}
 let utterance=new SpeechSynthesisUtterance(word);
 utterance.lang='en-US';utterance.rate=0.85;utterance.volume=1;
 const voices=speechSynthesis.getVoices();
 const voice=voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>v.lang.startsWith('en'));
 if(voice)utterance.voice=voice;
 utterance.onend=()=>{if(token===speechToken)speakButton.textContent=normalLabel;};
 utterance.onerror=()=>{if(token===speechToken)dictionaryFallback(word,token);};
 try{speechSynthesis.speak(utterance);speakButton.textContent='🔊 再生中（停止）';}
 catch(e){dictionaryFallback(word,token);}
}
speakButton.addEventListener('click',speakWord);
['prev','next','weak','known','shuffle','order','restart','reset','scope','direction'].forEach(id=>{
 $(id).addEventListener(id==='scope'||id==='direction'?'change':'click',stopSpeaking);
});
render();
